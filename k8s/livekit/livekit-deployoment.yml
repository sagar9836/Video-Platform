apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: video-platform

spec:
  replicas: 1

  selector:
    matchLabels:
      app: livekit

  template:
    metadata:
      labels:
        app: livekit

    spec:
      enableServiceLinks: false

      containers:
        - name: livekit
          image: livekit/livekit-server

          args:
            - "--config"
            - "/etc/livekit.yaml"

          env:
            - name: LIVEKIT_PORT
              value: "7880"

          ports:
            - containerPort: 7880
            - containerPort: 7881

          volumeMounts:
            - name: livekit-config
              mountPath: /etc/livekit.yaml
              subPath: livekit.yaml

      volumes:
        - name: livekit-config
          configMap:
            name: livekit-config

