apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: video-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 9836sagar9836/video-frontend:v1
          ports:
            - containerPort: 80
